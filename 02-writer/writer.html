<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ الكتاب السحري</title>
    <link rel="stylesheet" href="writer-style.css">
</head>
<body>

    <!-- حاوية المشهد الكاملة -->
    <div class="scene-background">
        
        <!-- خلفية الفيديو المتحرك -->
        <video autoplay muted loop playsinline class="bg-video">
            <source src="assets/images/snow.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>

        <!-- حاوية الكتاب الممتدة فوق الفيديو بدقة -->
        <div class="magic-book-overlay">
            <div class="single-page-container">
                <div class="page-scroll-box">
                    <h2 id="story-title" class="book-title"></h2>
                    <div id="story-content" class="story-text"></div>
                </div>
            </div>
        </div>

    </div>

    <script src="writer-engine.js"></script>
</body>
</html>
